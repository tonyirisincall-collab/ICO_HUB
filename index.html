<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUB</title>
  <!-- Favicon: Eye of Horus (inline SVG) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 10 L62 30 L58 50 L50 70 L42 50 L38 30 Z' fill='%235b5ff0' opacity='.8'/%3E%3Cpath d='M38 30 L50 10 L62 30 L58 50 L50 70 L42 50 Z' fill='none' stroke='%232fd6b0' stroke-width='3'/%3E%3Ccircle cx='50' cy='40' r='5' fill='%23ff7a7a'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6fb;
      --bg-2: #eef1fb;
      --card: #ffffff;
      --ink: #1f2440;
      --ink-soft: #6b7191;
      --indigo: #5b5ff0;
      --indigo-soft: #eceafd;
      --mint: #2fd6b0;
      --coral: #ff7a7a;
      --coral-soft: #ffeceb;
      --ring: rgba(91, 95, 240, 0.18);
      --shadow: 0 10px 30px rgba(40, 44, 90, 0.08);
    }
    * {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
      color: var(--ink);
      background:
        radial-gradient(1200px 500px at 85% -10%, #e3e9ff 0%, transparent 60%),
        radial-gradient(900px 500px at -10% 10%, #e2fbf3 0%, transparent 55%),
        var(--bg);
      background-attachment: fixed;
      padding: 40px 24px 80px;
    }
    .wrap {
      max-width: 860px;
      margin: 0 auto;
    }

    /* ---- Header with spinning orbit ---- */
    header {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-bottom: 34px;
      position: relative;
    }
    .hub-mark-wrapper {
      position: relative;
      width: 52px;
      height: 52px;
      flex-shrink: 0;
    }
    .hub-mark {
      width: 52px;
      height: 52px;
      position: relative;
      z-index: 2;
    }
    .hub-mark .node {
      transform-origin: center;
      animation: pulse 2.6s ease-in-out infinite;
    }
    .hub-mark .node:nth-child(2) {
      animation-delay: .3s;
    }
    .hub-mark .node:nth-child(3) {
      animation-delay: .6s;
    }
    .hub-mark .node:nth-child(4) {
      animation-delay: .9s;
    }
    @keyframes pulse {
      0%,
      100% {
        opacity: .55;
        transform: scale(1);
      }
      50% {
        opacity: 1;
        transform: scale(1.18);
      }
    }

    /* Spinning orbit ring */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 70px;
      height: 70px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      border: 2px dashed rgba(91, 95, 240, 0.2);
      animation: spin 8s linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    .orbit-ring::before {
      content: '';
      position: absolute;
      top: -4px;
      left: 50%;
      width: 8px;
      height: 8px;
      background: var(--mint);
      border-radius: 50%;
      transform: translateX(-50%);
      box-shadow: 0 0 12px var(--mint);
    }
    .orbit-ring::after {
      content: '';
      position: absolute;
      bottom: -4px;
      right: 50%;
      width: 6px;
      height: 6px;
      background: var(--coral);
      border-radius: 50%;
      transform: translateX(50%);
      box-shadow: 0 0 12px var(--coral);
    }
    @keyframes spin {
      to {
        transform: translate(-50%, -50%) rotate(360deg);
      }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 28px;
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .sub {
      color: var(--ink-soft);
      font-size: 13.5px;
      margin-top: 2px;
    }
    .sub .status-dot {
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--mint);
      margin-right: 6px;
      animation: blink 2s infinite;
    }
    @keyframes blink {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: .35;
      }
    }

    /* ---- Search only (no add button) ---- */
    .toolbar {
      display: flex;
      gap: 12px;
      margin-bottom: 22px;
    }
    .search {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
      border-radius: 16px;
      padding: 12px 16px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(31, 36, 64, 0.05);
      transition: box-shadow .2s, border-color .2s;
    }
    .search:focus-within {
      box-shadow: 0 0 0 4px var(--ring);
      border-color: var(--indigo);
    }
    .search svg {
      flex-shrink: 0;
      color: var(--ink-soft);
    }
    .search input {
      border: none;
      outline: none;
      font-family: 'Inter', sans-serif;
      font-size: 14.5px;
      width: 100%;
      background: transparent;
      color: var(--ink);
    }

    /* ---- Cards ---- */
    #list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(31, 36, 64, 0.05);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      opacity: 0;
      transform: translateY(10px);
      animation: rise .45s ease forwards;
      transition: transform .18s ease, box-shadow .18s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(40, 44, 90, 0.12);
    }
    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .icon-badge {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--indigo-soft);
      color: var(--indigo);
    }
    .card.locked .icon-badge {
      background: var(--coral-soft);
      color: var(--coral);
    }

    .card-body {
      flex: 1;
      min-width: 0;
    }
    .card-name {
      font-weight: 600;
      font-size: 15px;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-link {
      font-size: 12.5px;
      color: var(--ink-soft);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* No action buttons — removed */

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--ink-soft);
    }
    .empty svg {
      margin-bottom: 14px;
      opacity: .6;
    }

    /* ---- Modal (only unlock) ---- */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(31, 36, 64, 0.35);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 20px;
    }
    .overlay.show {
      display: flex;
      animation: fadeIn .2s ease;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }
    .modal {
      background: var(--card);
      border-radius: 20px;
      padding: 26px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 24px 60px rgba(20, 24, 50, 0.25);
      animation: pop .25s cubic-bezier(.2, .9, .3, 1.3);
    }
    @keyframes pop {
      from {
        opacity: 0;
        transform: scale(.92) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }
    .modal h2 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 19px;
      margin: 0 0 16px;
    }
    .field {
      margin-bottom: 12px;
    }
    .field label {
      font-size: 12.5px;
      color: var(--ink-soft);
      font-weight: 500;
      display: block;
      margin-bottom: 5px;
    }
    .field input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid #e6e8f4;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .15s;
    }
    .field input:focus {
      border-color: var(--indigo);
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }
    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 11px;
      border: none;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
    }
    .btn-primary {
      background: var(--indigo);
      color: #fff;
    }
    .btn-primary:hover {
      background: #4d51e0;
    }
    .btn-ghost {
      background: var(--bg-2);
      color: var(--ink-soft);
    }
    .btn-ghost:hover {
      background: #e2e5f5;
    }
    .error-msg {
      color: var(--coral);
      font-size: 12.5px;
      margin-top: 8px;
      min-height: 14px;
    }

    .toast {
      position: fixed;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink);
      color: #fff;
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 13.5px;
      opacity: 0;
      transition: all .25s ease;
      pointer-events: none;
      z-index: 60;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* decorative spinning ring on cards */
    .card::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, rgba(91, 95, 240, 0.03), transparent 60%);
      animation: spin-slow 20s linear infinite;
      pointer-events: none;
      z-index: 0;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .card:hover::after {
      opacity: 1;
    }
    @keyframes spin-slow {
      to {
        transform: rotate(360deg);
      }
    }
    /* ensure content stays above */
    .card>* {
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <header>
      <div class="hub-mark-wrapper">
        <!-- orbit ring -->
        <div class="orbit-ring"></div>
        <!-- hub logo -->
        <svg class="hub-mark" viewBox="0 0 52 52" fill="none">
          <circle class="node" cx="26" cy="12" r="4.5" fill="#5b5ff0" />
          <circle class="node" cx="40" cy="32" r="4.5" fill="#2fd6b0" />
          <circle class="node" cx="12" cy="32" r="4.5" fill="#ff7a7a" />
          <circle cx="26" cy="30" r="6" fill="#1f2440" />
          <line x1="26" y1="16.5" x2="26" y2="26" stroke="#c7cbf2" stroke-width="2" />
          <line x1="36.5" y1="29.5" x2="30" y2="30" stroke="#c7cbf2" stroke-width="2" />
          <line x1="15.5" y1="29.5" x2="22" y2="30" stroke="#c7cbf2" stroke-width="2" />
        </svg>
      </div>
      <div>
        <h1>HUB</h1>
        <div class="sub"><span class="status-dot"></span>lOADING</div>
      </div>
    </header>

    <!-- toolbar with only search -->
    <div class="toolbar">
      <div class="search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7" /><line x1="21" y1="21" x2="16.65" y2="16.65" /></svg>
        <input id="searchInput" placeholder="Search…" oninput="renderList()" />
      </div>
    </div>

    <div id="list"></div>

  </div>

  <!-- Unlock modal (only) -->
  <div class="overlay" id="unlockOverlay">
    <div class="modal">
      <h2>🔐 This item is locked</h2>
      <div class="field">
        <label>Password</label>
        <input id="unlockPass" type="password" placeholder="Enter password" onkeydown="if(event.key==='Enter')submitUnlock()" />
      </div>
      <div class="error-msg" id="unlockError"></div>
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeModal('unlockOverlay')">Cancel</button>
        <button class="btn btn-primary" onclick="submitUnlock()">Open</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /* ============================================================
       PASTE YOUR APPS SCRIPT WEB APP URL HERE
       ============================================================ */
    const API_URL = "https://script.google.com/macros/s/AKfycbzXhDAjbilflWJMdK4Y9O6mWqge-q_-conDT6cggIUIYiFARLywjWzyFGbBSQhD4Oc9/exec";

    let items = [];
    let pendingUnlockId = null;
    const POLL_MS = 4000; // auto‑refresh

    const lockSVG =
      `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>`;
    const linkSVG =
      `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 15l6-6"/><path d="M11 6l1-1a4 4 0 0 1 6 6l-1 1"/><path d="M13 18l-1 1a4 4 0 0 1-6-6l1-1"/></svg>`;

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2200);
    }

    async function api(action, params = {}) {
      const url = new URL(API_URL);
      url.searchParams.set('action', action);
      Object.keys(params).forEach(k => url.searchParams.set(k, params[k]));
      const res = await fetch(url.toString());
      return res.json();
    }

    async function loadItems(silent) {
      try {
        const data = await api('list');
        if (data.success) {
          items = data.items;
          renderList();
        } else if (!silent) {
          showToast('Could not load sheet: ' + data.error);
        }
      } catch (err) {
        if (!silent) showToast('Connection error — check the API_URL in the code.');
      }
    }

    function renderList() {
      const q = document.getElementById('searchInput').value.trim().toLowerCase();
      const list = document.getElementById('list');
      const filtered = items.filter(i => i.name.toLowerCase().includes(q));

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <div>${q ? 'Nothing matches your search' : 'No items yet — add them in the Google Sheet'}</div>
        </div>`;
        return;
      }

      list.innerHTML = filtered.map((item, idx) => `
        <div class="card ${item.locked ? 'locked' : ''}" style="animation-delay:${idx * 35}ms" onclick="handleCardClick(${item.id})">
          <div class="icon-badge">${item.locked ? lockSVG : linkSVG}</div>
          <div class="card-body">
            <div class="card-name">${escapeHtml(item.name)}</div>
            <div class="card-link">${item.locked ? 'Locked — click to unlock' : escapeHtml(item.link || '')}</div>
          </div>
          <!-- no edit/delete buttons -->
        </div>
      `).join('');
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' } [c]));
    }

    function handleCardClick(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      if (item.locked) {
        pendingUnlockId = id;
        document.getElementById('unlockPass').value = '';
        document.getElementById('unlockError').textContent = '';
        openModal('unlockOverlay');
        setTimeout(() => document.getElementById('unlockPass').focus(), 150);
      } else {
        window.open(item.link, '_blank');
      }
    }

    async function submitUnlock() {
      const pass = document.getElementById('unlockPass').value;
      const data = await api('unlock', { id: pendingUnlockId, password: pass });
      if (data.success) {
        closeModal('unlockOverlay');
        window.open(data.link, '_blank');
      } else {
        document.getElementById('unlockError').textContent = 'Wrong password — try again.';
      }
    }

    function openModal(id) { document.getElementById(id).classList.add('show'); }

    function closeModal(id) { document.getElementById(id).classList.remove('show'); }

    document.querySelectorAll('.overlay').forEach(ov => {
      ov.addEventListener('click', e => { if (e.target === ov) ov.classList.remove('show'); });
    });

    // initial load + polling
    loadItems();
    setInterval(() => loadItems(true), POLL_MS);
  </script>
</body>
</html>
